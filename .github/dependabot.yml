# Actions are pinned to commit SHAs, which freezes them until something bumps
# them deliberately — that something is this file. Without it the pins rot.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  # Same reasoning for the introspection image, pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # The package itself ships to npm, so its lockfile ages the same way pins do.
  # Security updates cover the urgent half; this covers the routine half.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
