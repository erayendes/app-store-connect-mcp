name: Bug report / Hata bildirimi
description: Something doesn't work the way the docs say. / Bir şey belgelerde anlatıldığı gibi çalışmıyor.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        **Before you post:** never paste your Key ID, Issuer ID or the contents of your `.p8` file.
        **Göndermeden önce:** Key ID, Issuer ID ya da `.p8` dosyanızın içeriğini asla paylaşmayın.

        Seeing 401, 403, 409 or 429? Most of these have a known fix in [Troubleshooting](https://github.com/erayendes/app-store-connect-mcp/blob/main/docs/SETUP_en.md#troubleshooting).
        401, 403, 409 ya da 429 mu görüyorsunuz? Çoğunun bilinen bir çözümü [Sorun giderme](https://github.com/erayendes/app-store-connect-mcp/blob/main/docs/SETUP_tr.md#sorun-giderme) bölümünde.

        You can write in English or Turkish. / İngilizce ya da Türkçe yazabilirsiniz.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened / Ne oldu
      description: What you asked the AI, what happened and what you expected. / Yapay zekâdan ne istediniz, ne oldu, ne bekliyordunuz?
      placeholder: |
        I asked it to update the subtitle of my app. It returned 409 Conflict, but the version is still in "Prepare for Submission".
    validations:
      required: true

  - type: input
    id: tool
    attributes:
      label: Tool involved / İlgili araç
      description: The tool name, e.g. `app_store_version_localizations__update`. Leave blank if it failed before any tool ran. / Araç adı, ör. `app_store_version_localizations__update`. Hiçbir araç çalışmadan hata verdiyse boş bırakın.
      placeholder: apps__customer_reviews__list

  - type: input
    id: version
    attributes:
      label: Heimdall version / Heimdall sürümü
      description: Run `npx -y @erayendes/asc-mcp --version`. / `npx -y @erayendes/asc-mcp --version` komutunu çalıştırın.
      placeholder: 2.5.0
    validations:
      required: true

  - type: dropdown
    id: app
    attributes:
      label: App / Uygulama
      description: Which app you use Heimdall in. / Heimdall'ı hangi uygulamada kullanıyorsunuz?
      options:
        - Claude Code
        - Claude Desktop
        - Codex
        - Cursor
        - Antigravity
        - Windsurf
        - VS Code
        - Xcode
        - Other (write it below) / Diğer (aşağıya yazın)
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system / İşletim sistemi
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: profiles
    attributes:
      label: Installed profiles / Kurulu profiller
      description: Which profiles you installed with setup. / Setup ile hangi profilleri kurdunuz?
      placeholder: marketing, analytics
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error message / Hata mesajı
      description: The full error, if there was one. / Varsa hatanın tamamı.
      render: text
