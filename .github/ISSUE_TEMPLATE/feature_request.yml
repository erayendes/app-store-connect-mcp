name: Feature request / Özellik önerisi
description: Suggest something Heimdall should do. / Heimdall'ın yapması gereken bir şey önerin.
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        **Looking for something Heimdall can't seem to do?** First ask the AI: *"Is there a tool for X?"* Heimdall searches every tool, including the ones you haven't installed.
        **Heimdall'ın yapamadığı bir şey mi arıyorsunuz?** Önce yapay zekâya sorun: *"X için bir araç var mı?"* Heimdall, kurmadığınızlar dahil bütün araçları arar.

        You can write in English or Turkish. / İngilizce ya da Türkçe yazabilirsiniz.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do? / Ne yapmaya çalışıyorsunuz?
      description: Describe the task, not the solution you have in mind. An existing tool often covers it. / Aklınızdaki çözümü değil, yapmak istediğiniz işi anlatın. Çoğu zaman mevcut bir araç bunu karşılıyor.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would help? / Ne işinize yarardı?
      description: How you'd like it to work. / Nasıl çalışmasını isterdiniz?
    validations:
      required: true

  - type: checkboxes
    id: checked
    attributes:
      label: Checks / Kontroller
      options:
        - label: I asked the AI "Is there a tool for X?" and it's not there. / Yapay zekâya "X için bir araç var mı?" diye sordum, yok.
        - label: This is about Heimdall, not about how Apple's own API works. / Bu, Apple'ın API'sinin nasıl çalıştığıyla değil, Heimdall'la ilgili.
