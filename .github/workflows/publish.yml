# Publishes to npm via trusted publishing (OIDC) — no NPM_TOKEN anywhere.
# npmjs.com is configured to trust this repository and this workflow filename,
# so renaming this file means updating the trusted publisher on npm too.
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # mint the OIDC token npm verifies
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24 for the npm it bundles, not for the runtime: trusted publishing
      # (OIDC -> registry token exchange) needs npm >= 11.5, and Node 22 ships
      # npm 10, which signs provenance but then PUTs without credentials while
      # npm masks the rejection as a 404. Node 24 ships npm 11.17. The package
      # itself still supports Node >= 20.19 — see engines in package.json.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # The 404 npm returns for a too-old client says nothing about the cause,
      # so name it here instead of at the publish step.
      - name: Fail early if npm cannot do trusted publishing
        run: |
          node -e 'const v = require("child_process").execSync("npm --version").toString().trim();
          const [a, b] = v.split(".").map(Number);
          if (a < 11 || (a === 11 && b < 5)) {
            console.error(`npm ${v} is too old for trusted publishing (need >= 11.5). Raise node-version above.`);
            process.exit(1);
          }
          console.log(`npm ${v} supports trusted publishing.`);'

      # server.json and package-lock.json are the versions this repo carries
      # that nothing else reads, so they are the ones that silently rot —
      # server.json sat at 1.2.0 through two releases, and the lockfile sat at
      # 1.3.0 through more. npm would not have noticed either: it reads
      # package.json. Fail here instead, before anything is published anywhere.
      # Everything a release gets wrong quietly, checked before any of it is
      # published. The description cap is enforced by the registry, but only
      # at publish time and only with a 422 — by then npm has the release and
      # the registry does not, which is the split this workflow exists to
      # prevent. A 101-character description cost exactly that once.
      #
      # The changelog heading is the worst of the three because nothing else
      # notices: the release job pulls its notes with awk, and an unmatched
      # heading yields an empty file, falls through to --generate-notes, and
      # publishes raw commit titles in place of the bilingual changelog. The
      # release succeeds. Only a human reading the release page finds out.
      - name: Pre-flight the release metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e 'const fs = require("fs");
          const pkg = require("./package.json").version;
          const srv = require("./server.json");
          const lock = require("./package-lock.json");
          const tag = process.env.TAG.startsWith("v") ? process.env.TAG.slice(1) : null;
          // CITATION.cff sat two releases behind before it was checked here.
          // Parsed with a regex rather than a YAML dependency: one scalar field.
          const citation = fs.readFileSync("CITATION.cff", "utf8");
          const cffVersion = (citation.match(/^version:\s*"?([^"\s]+)"?/m) || [])[1];
          const seen = { "package.json": pkg, "server.json": srv.version, "server.json packages[0]": srv.packages[0].version, "package-lock.json": lock.version, "package-lock.json packages[\"\"]": lock.packages[""].version, "CITATION.cff": cffVersion };
          if (tag) seen["git tag"] = tag;
          const values = [...new Set(Object.values(seen))];
          if (values.length > 1) {
            console.error("Version mismatch:");
            for (const [where, v] of Object.entries(seen)) console.error(`  ${where}: ${v}`);
            process.exit(1);
          }
          if (srv.description.length > 100) {
            console.error(`server.json description is ${srv.description.length} characters; the registry rejects anything over 100.`);
            process.exit(1);
          }
          // The tool count is advertised on four surfaces and drifted to three
          // different numbers (868/875/883) before this check existed. README is
          // the source of truth because it is regenerated against the code.
          const readme = fs.readFileSync("README.md", "utf8");
          const counts = { "README.md": (readme.match(/([0-9]{3,4}) tools\./) || [])[1], "server.json": (srv.description.match(/([0-9]{3,4}) tools/) || [])[1], "CITATION.cff": (citation.match(/with ([0-9]{3,4}) tools/) || [])[1] };
          const distinct = [...new Set(Object.values(counts))];
          if (distinct.length > 1 || !distinct[0]) {
            console.error("Tool count mismatch across advertised surfaces:");
            for (const [where, n] of Object.entries(counts)) console.error(`  ${where}: ${n}`);
            process.exit(1);
          }
          const heading = new RegExp("^### \\[" + values[0].replace(/\./g, "\\.") + "\\]", "m");
          if (!heading.test(require("fs").readFileSync("docs/CHANGELOG.md", "utf8"))) {
            console.error(`docs/CHANGELOG.md has no "### [${values[0]}]" heading, so the release notes would silently fall back to raw commit titles.`);
            process.exit(1);
          }
          console.log(`All versions agree on ${values[0]}, ${distinct[0]} tools everywhere, and the changelog has a heading for it.`);'

      - run: npm ci

      # Rebuild from the spec and fail if the committed output drifted, so a
      # release can never ship generated tools that don't match the source.
      - run: npm run generate
      - name: Fail if generated output is stale
        run: git diff --exit-code src/generated/

      - run: npm run build
      - run: npm test

      # --provenance publishes a signed attestation linking the tarball to this
      # repository, commit and workflow run.
      - run: npm publish --provenance

      # The MCP Registry is a separate publication from npm, and until now it
      # had no step at all: 1.1.2 and 1.2.0 were pushed by hand and 1.3.0 and
      # 2.0.0 were never pushed, so the registry advertised 1.2.0 while npm
      # served 2.0.0. It reads server.json, which the check above has already
      # matched against package.json and the tag.
      #
      # Deliberately not pinned. The publisher and the registry negotiate an
      # OIDC audience, and an old binary fails with "invalid audience" — the
      # documented fix is to fetch latest, so pinning buys a reproducible
      # build at the price of a release that cannot publish.
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # Same id-token: write this job already mints for npm, different
      # audience. No secret, nothing to rotate.
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  # Separate job so the npm publish above keeps a read-only token: only this
  # step needs contents:write, and it never touches the OIDC path.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # `npm sbom` reads the installed tree, so the deps have to be there;
      # lifecycle scripts contribute nothing to the manifest.
      - run: npm ci --ignore-scripts

      - name: Generate an SPDX SBOM of the shipped dependencies
        env:
          TAG: ${{ github.ref_name }}
        run: npm sbom --sbom-format spdx --omit=dev > "asc-mcp-${TAG}-sbom.spdx.json"

      - name: Create GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi

          # Pull the matching English changelog section; the Turkish mirror
          # repeats the same headings further down, so stop at the next one.
          awk -v ver="${TAG#v}" '
            $0 ~ "^### \\[" ver "\\]" { found = 1; next }
            found && (/^### / || /^## /) { exit }
            found { print }
          ' docs/CHANGELOG.md > /tmp/notes.md

          # Release immutability freezes assets at publish time, so the SBOM has
          # to go up with the release rather than being attached afterwards.
          sbom="asc-mcp-${TAG}-sbom.spdx.json"

          if [ -s /tmp/notes.md ]; then
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md "$sbom"
          else
            echo "No changelog entry for $TAG — falling back to generated notes."
            gh release create "$TAG" --title "$TAG" --generate-notes "$sbom"
          fi
