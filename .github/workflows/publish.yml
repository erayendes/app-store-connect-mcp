# Publishes to npm via trusted publishing (OIDC) — no NPM_TOKEN anywhere.
# npmjs.com is configured to trust this repository and this workflow filename,
# so renaming this file means updating the trusted publisher on npm too.
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # mint the OIDC token npm verifies
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Rebuild from the spec and fail if the committed output drifted, so a
      # release can never ship generated tools that don't match the source.
      - run: npm run generate
      - name: Fail if generated output is stale
        run: git diff --exit-code src/generated/

      - run: npm run build
      - run: npm test

      # --provenance publishes a signed attestation linking the tarball to this
      # repository, commit and workflow run.
      - run: npm publish --provenance

  # Separate job so the npm publish above keeps a read-only token: only this
  # step needs contents:write, and it never touches the OIDC path.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi

          # Pull the matching English changelog section; the Turkish mirror
          # repeats the same headings further down, so stop at the next one.
          awk -v ver="${TAG#v}" '
            $0 ~ "^### \\[" ver "\\]" { found = 1; next }
            found && (/^### / || /^## /) { exit }
            found { print }
          ' docs/CHANGELOG.md > /tmp/notes.md

          if [ -s /tmp/notes.md ]; then
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          else
            echo "No changelog entry for $TAG — falling back to generated notes."
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
