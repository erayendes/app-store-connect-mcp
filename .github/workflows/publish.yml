# Publishes to npm via trusted publishing (OIDC) — no NPM_TOKEN anywhere.
# npmjs.com is configured to trust this repository and this workflow filename,
# so renaming this file means updating the trusted publisher on npm too.
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # mint the OIDC token npm verifies
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Rebuild from the spec and fail if the committed output drifted, so a
      # release can never ship generated tools that don't match the source.
      - run: npm run generate
      - name: Fail if generated output is stale
        run: git diff --exit-code src/generated/

      - run: npm run build
      - run: npm test

      # Trusted publishing (OIDC -> registry token exchange) needs npm >= 11.5;
      # Node 22 ships npm 10, which signs provenance but then PUTs without
      # credentials and npm masks the rejection as a 404.
      - run: npm install -g npm@latest

      # --provenance publishes a signed attestation linking the tarball to this
      # repository, commit and workflow run.
      - run: npm publish --provenance

  # Separate job so the npm publish above keeps a read-only token: only this
  # step needs contents:write, and it never touches the OIDC path.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # `npm sbom` reads the installed tree, so the deps have to be there;
      # lifecycle scripts contribute nothing to the manifest.
      - run: npm ci --ignore-scripts

      - name: Generate an SPDX SBOM of the shipped dependencies
        env:
          TAG: ${{ github.ref_name }}
        run: npm sbom --sbom-format spdx --omit=dev > "asc-mcp-${TAG}-sbom.spdx.json"

      - name: Create GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi

          # Pull the matching English changelog section; the Turkish mirror
          # repeats the same headings further down, so stop at the next one.
          awk -v ver="${TAG#v}" '
            $0 ~ "^### \\[" ver "\\]" { found = 1; next }
            found && (/^### / || /^## /) { exit }
            found { print }
          ' docs/CHANGELOG.md > /tmp/notes.md

          # Release immutability freezes assets at publish time, so the SBOM has
          # to go up with the release rather than being attached afterwards.
          sbom="asc-mcp-${TAG}-sbom.spdx.json"

          if [ -s /tmp/notes.md ]; then
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md "$sbom"
          else
            echo "No changelog entry for $TAG — falling back to generated notes."
            gh release create "$TAG" --title "$TAG" --generate-notes "$sbom"
          fi
